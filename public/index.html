<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Giv AI — ИИ-помощник</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#191919;background:#fff}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5}.app{height:100dvh;min-height:520px;display:flex}.side{width:238px;background:#fafafa;border-right:1px solid #eee;padding:15px 12px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:750;padding:5px 8px 15px}.logo{width:36px;height:36px;background:#171717;color:#fff;border-radius:12px;display:grid;place-items:center}.nav,.thread{border:0;background:transparent;color:#555;text-align:left;padding:10px;border-radius:9px}.nav:hover,.thread:hover{background:#eee}.label{font-size:11px;color:#999;padding:16px 10px 4px}.threads{display:flex;flex-direction:column;gap:3px;overflow:auto}.thread{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread.active{background:#e9e9e9;color:#111}.sidefoot{margin-top:auto;border-top:1px solid #e8e8e8;padding-top:10px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #f0f0f0}.status{font-size:11px;color:#777}.feed{flex:1;overflow:auto;padding:25px 18px;display:flex;flex-direction:column;gap:22px}.welcome{margin:auto;max-width:540px;width:100%;text-align:center}.welcome-logo{margin:0 auto 20px;width:58px;height:58px;border-radius:19px;background:#171717;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700}.welcome h1{font-size:28px;margin:0 0 10px;letter-spacing:-.8px}.welcome p{color:#888;margin-bottom:25px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}.suggest{border:1px solid #e6e6e6;background:white;border-radius:12px;padding:13px;color:#333;min-height:72px}.suggest small{display:block;color:#999;margin-top:5px}.message{max-width:min(760px,92%);font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#f1f1f1;padding:12px 15px;border-radius:16px 16px 4px 16px}.assistant{align-self:center;width:100%;max-width:760px}.message img{max-width:260px;max-height:200px;object-fit:contain;display:block;margin-bottom:8px;border-radius:10px}.composer-wrap{padding:8px 16px 12px}.composer{max-width:760px;margin:auto;border:1px solid #ddd;border-radius:17px;padding:12px}.composer textarea{width:100%;border:0;outline:0;resize:vertical;min-height:55px;max-height:150px;padding:5px;background:transparent}.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.tool{border:0;background:#f4f4f4;border-radius:9px;padding:9px 12px;color:#444}.send{border:0;background:#171717;color:#fff;border-radius:10px;padding:10px 14px}.attach{max-width:760px;margin:0 auto 7px;display:flex;align-items:center;gap:8px;font-size:12px;color:#666}.attach img{width:55px;height:48px;object-fit:cover;border-radius:8px}.hint{text-align:center;color:#999;font-size:10px;margin:8px auto 0}.hidden{display:none!important}.modal-bg{position:fixed;inset:0;background:#0005;display:grid;place-items:center;padding:20px}.modal{background:white;padding:22px;border-radius:16px;max-width:410px;width:100%}.modal p{font-size:14px;color:#666;line-height:1.6}
@media(max-width:620px){.side{width:57px;padding:10px 5px;align-items:center}.brand{padding:3px}.brandname,.navlabel,.label,.thread,.profiletext{display:none}.side>.nav{width:43px;text-align:center;padding:11px 0;font-size:0}.side>.nav:first-of-type{font-size:18px}.top{padding:0 12px}.feed{padding:16px 11px}.composer-wrap{padding:8px}.message{max-width:97%}.welcome h1{font-size:24px}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand"><span class="logo">G</span><span class="brandname">Giv AI</span></div><button id="new" class="nav">＋ <span class="navlabel">Новый чат</span></button><button id="history" class="nav">◷ <span class="navlabel">История</span></button><div class="label">Недавние</div><div id="threads" class="threads"></div><div class="sidefoot"><button id="about" class="nav">ⓘ <span class="navlabel">О подключении</span></button></div></aside>
<main class="main"><header class="top"><b>Giv AI <span style="font-weight:400;color:#aaa">/ Чат</span></b><span id="status" class="status">Проверка подключения…</span></header><section id="feed" class="feed"></section><div id="attach" class="attach hidden"></div><div class="composer-wrap"><div class="composer"><textarea id="prompt" rows="2" placeholder="Напиши сообщение… (Enter — отправить)"></textarea><div class="bottom"><div style="display:flex;gap:6px"><button id="pick" class="tool" title="Добавить изображение">＋ Фото</button><input id="file" class="hidden" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><button id="mic" class="tool" title="Голосовой ввод">♩ Голос</button></div><button id="send" class="send">Отправить ↑</button></div></div><div class="hint">Не отправляй пароли или другие секретные данные.</div></div></main></div>
<div id="modal" class="modal-bg hidden"><div class="modal"><h3 style="margin-top:0">Подключение Giv AI</h3><p>Настоящие ответы генерируются через серверный API. Секретный ключ хранится на сервере, а не в браузере. Без ключа облачная модель недоступна.</p><p id="modalstatus" style="font-size:12px"></p><button id="close" class="send" style="width:100%">Понятно</button></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),key='giv-ai-history-v1';let chats=[],current=null,image=null,busy=false,rec=null;
try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))chats=a}catch{}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),active=()=>chats.find(c=>c.id===current);
const welcome=`<div class="welcome"><div class="welcome-logo">G</div><h1>Чем займёмся?</h1><p>Спроси, придумай, исследуй.</p><div class="cards"><button class="suggest" data-p="Объясни сложную тему простыми словами."><b>✳ Обучение</b><small>Понятные объяснения</small></button><button class="suggest" data-p="Помоги придумать идею для проекта."><b>◇ Идеи</b><small>Новые проекты</small></button><button class="suggest" data-p="Помоги написать код для моего проекта."><b>⌘ Код</b><small>Разработка</small></button><button class="suggest" data-p="Помоги улучшить мой текст."><b>▤ Тексты</b><small>Написание и редактура</small></button></div></div>`;
function save(){try{localStorage.setItem(key,JSON.stringify(chats))}catch{$('status').textContent='Не удалось сохранить историю'}}
function render(){const f=$('feed'),c=active();f.replaceChildren();if(!c||!c.messages.length){f.innerHTML=welcome;f.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.p;$('prompt').focus()})}else c.messages.forEach(m=>{const el=document.createElement('div');el.className='message '+m.role;if(m.image){const im=document.createElement('img');im.src=m.image;im.alt='Прикреплённое изображение';el.append(im)}const t=document.createElement('div');t.textContent=m.text;el.append(t);if(m.error){const e=document.createElement('div');e.style.cssText='color:#a33;margin-top:8px';e.textContent=m.error;el.append(e)}f.append(el)});f.scrollTop=f.scrollHeight;const list=$('threads');list.replaceChildren();chats.slice(0,40).forEach(c=>{const b=document.createElement('button');b.className='thread'+(c.id===current?' active':'');b.textContent=c.title;b.title=c.title;b.onclick=()=>{current=c.id;image=null;render()};list.append(b)});const a=$('attach');a.replaceChildren();a.classList.toggle('hidden',!image);if(image){const im=document.createElement('img');im.src=image;im.alt='Выбранное изображение';a.append(im);const tx=document.createElement('span');tx.textContent='Изображение прикреплено';a.append(tx);const rm=document.createElement('button');rm.className='tool';rm.textContent='Убрать';rm.onclick=()=>{image=null;render()};a.append(rm)}}
function fresh(){current=uid();chats.unshift({id:current,title:'Новый чат',messages:[]});image=null;save();render();$('prompt').focus()}
async function send(){const text=$('prompt').value.trim();if((!text&&!image)||busy)return;if(!active())fresh();const c=active(),img=image;c.messages.push({role:'user',text:text||(img?'Что изображено на картинке?':''),image:img||null});if(c.messages.length===1)c.title=(text||'Изображение').slice(0,34);$('prompt').value='';image=null;save();render();busy=true;$('send').disabled=true;$('send').textContent='Думаю…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:c.messages.map(m=>({role:m.role,text:m.text,image:m.image||undefined}))})});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка сервера');c.messages.push({role:'assistant',text:d.answer});}catch(e){c.messages.push({role:'assistant',text:'Не удалось получить ответ.',error:e.message||'Проверь подключение к серверу.'})}save();busy=false;$('send').disabled=false;$('send').textContent='Отправить ↑';render()}
$('new').onclick=fresh;$('history').onclick=()=>{$('status').textContent='История сохранена в этом браузере'};$('send').onclick=send;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('pick').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('Выбери изображение');if(f.size>5*1024*1024)return alert('Максимальный размер — 5 МБ');const r=new FileReader();r.onload=()=>{image=r.result;render()};r.readAsDataURL(f);e.target.value=''};
$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').textContent='Голос недоступен в этом браузере';return}if(rec){rec.stop();rec=null;return}rec=new SR();rec.lang='ru-RU';rec.interimResults=true;rec.onresult=e=>{let s='';for(let i=e.resultIndex;i<e.results.length;i++)s+=e.results[i][0].transcript;$('prompt').value=s};rec.onerror=e=>$('status').textContent='Микрофон: '+e.error;rec.onend=()=>{rec=null};$('status').textContent='Слушаю…';try{rec.start()}catch{$('status').textContent='Не удалось включить микрофон'}};
$('about').onclick=()=>$('modal').classList.remove('hidden');$('close').onclick=()=>$('modal').classList.add('hidden');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')};
if(!chats.length){chats=[{id:uid(),title:'Новый чат',messages:[]}];current=chats[0].id;save()}else current=chats[0].id;render();
fetch('/api/status').then(r=>r.json()).then(d=>{$('status').textContent=d.configured?'ИИ подключён · '+d.model:'API не подключён';$('modalstatus').textContent=d.configured?'Сервер видит настроенный API.':'Добавь OPENAI_API_KEY в секретные переменные сервера.'}).catch(()=>{$('status').textContent='Сервер не запущен';$('modalstatus').textContent='Открывай сайт через сервер Node.js, а не как локальный HTML-файл.'});
})();
</script></body></html>
